<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#d1d5db;--pr:#001037;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--in:#111827}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--in:#111827}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;font-size:16px}
header{background:var(--pr);color:#fff;padding:14px 16px;text-align:center;font-weight:700;font-size:20px}
main{max-width:1200px;margin:auto;padding:12px;display:grid;gap:16px;grid-template-columns:1fr}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:1fr 60px 80px 32px;gap:6px;margin-bottom:6px}
.item button{padding:0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--pr);color:#fff;font-weight:600}
button.g{background:#4b5563}button.o{background:transparent;border:1px dashed var(--pr);color:var(--pr)}
.acts{display:grid;gap:8px;margin-top:12px}
#msg{font-size:14px;margin-top:8px;color:var(--mu)}
.wrap{overflow-x:auto;background:#9ca3af;padding:10px;border-radius:12px}
#inv{width:794px;min-height:1000px;background:#fff;color:#111;padding:36px 40px;font-family:'Noto Sans Bengali','Hind Siliguri',sans-serif;position:relative}
#inv .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #001037;padding-bottom:12px}
#inv .nm{font-size:30px;font-weight:700;color:#001037;line-height:1.2}#inv .nm small{font-size:inherit;font-weight:inherit}
#inv .sub{font-size:14px;color:#444;margin-top:4px;line-height:1.8}#inv .ic{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-right:4px}#inv .ic b{font-size:11px;color:#fff;padding:0 6px;border-radius:4px;line-height:17px;font-weight:700;font-family:Arial,sans-serif}#inv .bk{background:#e2136e}#inv .ng{background:#f6921e}
#inv .tt{font-size:26px;font-weight:700;text-align:right;color:#111}
#inv .meta{display:flex;justify-content:space-between;margin:18px 0;font-size:15px;gap:20px}
#inv .meta div{line-height:1.7}
#inv table{width:100%;border-collapse:collapse;font-size:15px}
#inv th{background:#001037;color:#fff;padding:8px;text-align:left;font-weight:600}
#inv td{padding:8px;border-bottom:1px solid #ddd}
#inv .n{text-align:right}#inv .stamp{position:absolute;right:70px;top:430px;transform:rotate(-15deg);border:5px solid #15803d;color:#15803d;font-size:44px;font-weight:700;padding:2px 22px;border-radius:10px;opacity:.55}
#inv .tot{margin-left:auto;width:55%;margin-top:14px;font-size:16px}
#inv .tot div{display:flex;justify-content:space-between;padding:5px 8px}
#inv .tot .b{background:#e3e6f0;font-weight:700;font-size:18px}

#inv .sig span{border-top:1px solid #333;padding-top:4px;min-width:150px;text-align:center}
#inv .ft{text-align:center;font-size:13px;color:#555;margin-top:26px}

<button onclick="sh()" style="background:#15803d">📤 শেয়ার করুন (WhatsApp ইত্যাদি)</button>
<button class="g" onclick="nw()">🆕 নতুন ইনভয়েস</button>
</div>
<div id="msg"></div>
</section>
<section class="wrap"><div id="inv"></div></section>
</main>

function money(n){return bn((Math.round(n*100)/100).toLocaleString('en-US'))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fdate(v){if(!v)return '';var p=v.split('-');return bn(p[2]+'/'+p[1]+'/'+p[0])}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextNo(){var n=1;try{n=(parseInt(localStorage.getItem('mkinv'))||0)+1}catch(e){}return n}
function renderItems(){
  $('items').innerHTML=items.map(function(it,i){
    return '<div class="item"><input placeholder="বিবরণ (যেমন: ফুল পেইন্টিং)" value="'+esc(it.d)+'" oninput="upd('+i+',\'d\',this.value)">'+
    '<input type="number" min="0" placeholder="পরিমাণ" value="'+it.q+'" oninput="upd('+i+',\'q\',this.value)">'+
    '<input type="number" min="0" placeholder="দাম" value="'+it.p+'" oninput="upd('+i+',\'p\',this.value)">'+
    '<button class="g" onclick="del('+i+')">✕</button></div>'}).join('');
}
function addItem(){items.push({d:'',q:1,p:''});renderItems();draw()}
function del(i){if(items.length>1){items.splice(i,1);renderItems();draw()}}
function upd(i,k,v){items[i][k]=v;draw()}
function draw(){
  var sub=0,rows='';
  items.forEach(function(it,i){
    var t=(parseFloat(it.q)||0)*(parseFloat(it.p)||0);sub+=t;
    if(it.d||it.p)rows+='<tr><td>'+bn(i+1)+'</td><td>'+esc(it.d)+'</td><td class="n">'+bn(it.q||0)+'</td><td class="n">'+money(parseFloat(it.p)||0)+'</td><td class="n">'+money(t)+'</td></tr>';
  });
  var ds=parseFloat($('ds').value)||0,pd=parseFloat($('pd').value)||0,paid=$('st').value==='paid',tot=Math.max(sub-ds,0),due=paid?0:tot-pd;
  $('inv').innerHTML=
  (paid?'<div class="stamp">পরিশোধিত</div>':'')+'<div class="top"><div><div class="nm">এম কে স্প্রে পেইন্টিং <small>&amp; ডেন্টিং ওয়ার্কস</small></div><div class="sub">📍 ৫/২ বসু বাজার লেন, নারিন্দা, ঢাকা - ১১০০<br><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#25D366"/><path fill="#fff" d="M12 5.500a6.500 6.500 0 0 0-5.600 9.800L5.500 18.500l3.300-.9A6.500 6.500 0 1 0 12 5.500z"/><path fill="#25D366" d="M9.500 8.800c.2-.4.500-.4.700-.4l.5 1.100-.4.600c.5 1 1.300 1.700 2.300 2.200l.6-.6 1.100.5c0 .3-.2.900-.8 1.100-1.600.4-4.500-2-4-4.500z"/></svg><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0f8ff5"/><path fill="#fff" d="M12 5.500c-3.600 0-6.500 2.400-6.500 5.400 0 1.700.9 3.100 2.400 4.100L7.300 18.500l3.100-1.600c.5.100 1 .1 1.600.1 3.600 0 6.500-2.400 6.500-5.400S15.600 5.500 12 5.500z"/></svg><b class="bk">bKash</b><b class="ng">Nagad</b></span> +৮৮০১৭১০-৪০৭৭০১<br>📞 +৮৮০১৮১৯-১৫৬৪১১<br>✉️ mkspraypaintingdaintingworks@gmail.com</div></div><div class="tt">ইনভয়েস</div></div>'+
  '<div class="meta"><div><b>গ্রাহক:</b> '+esc($('cn').value)+'<br><b>মোবাইল:</b> '+esc($('cp').value)+'<br><b>ঠিকানা:</b> '+esc($('ad').value)+'</div>'+
  '<div style="text-align:right"><b>ইনভয়েস নং:</b> '+esc($('no').value)+'<br><b>তারিখ:</b> '+fdate($('dt').value)+'<br><b>গাড়ির নম্বর:</b> '+esc($('vn').value)+'<br><b>মডেল:</b> '+esc($('vm').value)+'</div></div>'+

  '<div class="ft">আমাদের সেবা গ্রহণের জন্য আপনাকে ধন্যবাদ।</div><div class="ft" style="margin-top:6px"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M13.500 20v-6.500h2.200l.4-2.700h-2.600V9.100c0-.8.200-1.300 1.300-1.300h1.400V5.400c-.2 0-1.100-.1-2-.1-2.100 0-3.500 1.300-3.500 3.600v1.900H8.500v2.700h2.200V20z"/></svg>facebook.com/MkDilder</span></div>';

function nw(){
  try{localStorage.setItem('mkinv',String(parseInt($('no').value)||nextNo()))}catch(e){}
  items=[{d:'',q:1,p:''}];['cn','cp','vn','vm','ad'].forEach(function(i){$(i).value=''});
  $('ds').value=0;$('pd').value=0;$('st').value='due';$('no').value=nextNo();$('dt').value=today();renderItems();draw();$('msg').textContent='নতুন ইনভয়েস প্রস্তুত।';
}
async function mkpdf(){
  await document.fonts.ready;
  var c=await html2canvas($('inv'),{scale:2,backgroundColor:'#fff'});
  var pdf=new window.jspdf.jsPDF('p','mm','a4');
  var w=210,h=c.height*w/c.width;
  if(h>297){var k=297/h;w=w*k;h=297}
  pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',(210-w)/2,0,w,h);
  var nm='Invoice-'+($('no').value||'new')+'-'+($('cn').value||'customer').replace(/[^\w\u0980-\u09FF-]+/g,'_')+'.pdf';
  try{localStorage.setItem('mkinv',String(parseInt($('no').value)||0))}catch(e){}
  return {blob:pdf.output('blob'),nm:nm};
}
async function dl(){
  var m=$('msg');m.textContent='PDF তৈরি হচ্ছে...';
  try{
    var r=await mkpdf(),u=URL.createObjectURL(r.blob),a=document.createElement('a');
    a.href=u;a.download=r.nm;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},20000);
    m.textContent='✅ PDF ডাউনলোড হয়েছে (ফোনের Downloads ফোল্ডারে দেখুন)।';
  }catch(e){m.textContent='সমস্যা হয়েছে: '+((e&&e.message)||e)}
}
async function sh(){
  var m=$('msg');m.textContent='PDF তৈরি হচ্ছে...';
  try{
    var r=await mkpdf(),f=new File([r.blob],r.nm,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:r.nm});m.textContent='✅ শেয়ার করা হয়েছে।'}
    else{m.textContent='এই ফোনে শেয়ার সম্ভব নয়, ডাউনলোড বাটন ব্যবহার করুন।'}
  }catch(e){m.textContent=(e&&e.name==='AbortError')?'শেয়ার বাতিল করা হয়েছে।':'সমস্যা হয়েছে: '+((e&&e.message)||e)}
}
